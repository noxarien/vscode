<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="0; url=https://vscode-mocha.vercel.app/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Open FRI Live Status</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #eef3f8;
        color: #172033;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        padding: 24px;
        border: 1px solid #dce2eb;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.92);
        text-align: center;
      }

      a {
        color: #174f99;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Opening FRI Live Status...</p>
      <p><a href="https://vscode-mocha.vercel.app/">Open the dashboard</a></p>
    </main>
  </body>
</html>
