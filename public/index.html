<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FRI Live Status</title>
    <link rel="preconnect" href="https://tr.rbxcdn.com">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="./index.html" aria-label="FRI Live Status">
          <span class="brand-mark">F</span>
          <span>
            <strong>FRI Live Status</strong>
            <small>Game support board</small>
          </span>
        </a>
        <div class="status-strip">
          <span class="live-dot"></span>
          <span id="refreshLabel">Syncing Roblox</span>
        </div>
      </header>

      <main>
        <section class="hero">
          <div>
            <p class="eyebrow">Current support activity</p>
            <h1>FRI game support and Studio presence.</h1>
          </div>
          <div class="hero-metrics" aria-live="polite">
            <div>
              <span id="totalPlaying">--</span>
              <small>players online</small>
            </div>
            <div>
              <span id="studioCount">--</span>
              <small>in Studio</small>
            </div>
            <div>
              <span id="onlineCount">--</span>
              <small>support online</small>
            </div>
          </div>
        </section>

        <section class="section-header">
          <div>
            <p class="eyebrow">Experiences</p>
            <h2>Game Support Experiences</h2>
          </div>
          <button class="refresh-button" id="refreshButton" type="button">Refresh</button>
        </section>
        <section class="game-grid" id="gamesGrid" aria-live="polite"></section>

        <section class="section-header people-header">
          <div>
            <p class="eyebrow">Support team</p>
            <h2>Roles and Studio Time</h2>
          </div>
        </section>
        <section id="peopleSections" aria-live="polite"></section>
      </main>
    </div>

    <dialog class="timeline-dialog" id="timelineDialog" aria-labelledby="timelineTitle">
      <div class="timeline-panel">
        <header class="timeline-header">
          <div>
            <p class="eyebrow" id="timelineEyebrow">Observed timeline</p>
            <h2 id="timelineTitle">Game timeline</h2>
            <p id="timelineSubtitle"></p>
          </div>
          <button class="icon-button" id="timelineClose" type="button" aria-label="Close timeline">&times;</button>
        </header>
        <div class="timeline-list" id="timelineList"></div>
      </div>
    </dialog>

    <template id="gameTemplate">
      <article class="game-card" tabindex="0" role="button" aria-label="Open game timeline">
        <div class="game-body">
          <div class="game-heading">
            <span class="game-index"></span>
            <h3></h3>
          </div>
          <div class="game-summary">
            <div>
              <span>Last updated</span>
              <div class="updated"></div>
            </div>
            <div>
              <span>Playing now</span>
              <strong class="game-player-count"></strong>
            </div>
          </div>
        </div>
      </article>
    </template>

    <template id="personTemplate">
      <article class="person-card" tabindex="0" role="button" aria-label="Open person timeline">
        <img alt="" width="72" height="72">
        <div class="person-main">
          <div class="person-title">
            <h3></h3>
            <span class="presence-badge"></span>
          </div>
          <p class="role"></p>
          <p class="location"></p>
          <a target="_blank" rel="noreferrer">View profile</a>
        </div>
      </article>
    </template>

    <template id="sectionTemplate">
      <section class="people-section">
        <div class="people-section-heading">
          <h3></h3>
          <p></p>
        </div>
        <div class="people-grid"></div>
      </section>
    </template>

    <script src="./app.js" type="module"></script>
  </body>
</html>
