<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0d10">
    <title>ER:LC Staff Tracker</title>
    <link rel="preconnect" href="https://tr.rbxcdn.com">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body data-tracker="erlc">
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="./index.html" aria-label="FRI Staff Tracker">
          <span class="brand-mark">FRI</span>
          <span>
            <strong>Staff Tracker</strong>
            <small>Operations</small>
          </span>
        </a>

        <nav class="tracker-switch" aria-label="Choose tracker">
          <a href="./index.html">Current Tracker</a>
          <a class="active" href="./erlc.html" aria-current="page">ER:LC Tracker</a>
        </nav>

        <div class="status-strip" aria-live="polite">
          <span class="live-dot"></span>
          <span id="refreshLabel">Syncing Roblox</span>
        </div>
      </header>

      <main>
        <section class="overview" aria-labelledby="pageTitle">
          <div class="overview-title">
            <p class="eyebrow">ER:LC tracker</p>
            <h1 id="pageTitle">ER:LC Staff Tracker</h1>
          </div>
          <div class="overview-metrics" aria-live="polite">
            <div>
              <span id="totalPlaying">--</span>
              <small>playing</small>
            </div>
            <div>
              <span id="studioCount">--</span>
              <small>in Studio</small>
            </div>
            <div>
              <span id="onlineCount">--</span>
              <small>online</small>
            </div>
          </div>
        </section>

        <section class="section-header">
          <div>
            <p class="eyebrow">Private experiences</p>
            <h2>Tracked Games <span>9</span></h2>
          </div>
          <button class="refresh-button" id="refreshButton" type="button">Refresh</button>
        </section>
        <section class="game-grid" id="gamesGrid" aria-live="polite"></section>

        <section class="section-header people-header">
          <div>
            <p class="eyebrow">Ranked highest first</p>
            <h2>Team Presence</h2>
          </div>
        </section>
        <section id="peopleSections" aria-live="polite"></section>
      </main>
    </div>

    <dialog class="timeline-dialog" id="timelineDialog" aria-labelledby="timelineTitle">
      <div class="timeline-panel">
        <header class="timeline-header">
          <div>
            <p class="eyebrow" id="timelineEyebrow">Observed timeline</p>
            <h2 id="timelineTitle">Timeline</h2>
            <p id="timelineSubtitle"></p>
          </div>
          <button class="icon-button" id="timelineClose" type="button" aria-label="Close timeline">×</button>
        </header>
        <div class="timeline-list" id="timelineList"></div>
      </div>
    </dialog>

    <template id="gameTemplate">
      <article class="game-card" tabindex="0" role="button" aria-label="Open game timeline">
        <div class="game-body">
          <div class="game-heading">
            <span class="game-index"></span>
            <h3></h3>
          </div>
          <div class="game-summary">
            <div>
              <span>Last updated</span>
              <div class="updated"></div>
            </div>
            <div>
              <span>Playing now</span>
              <strong class="game-player-count"></strong>
            </div>
          </div>
        </div>
      </article>
    </template>

    <template id="personTemplate">
      <article class="person-card" tabindex="0" role="button" aria-label="Open person timeline">
        <img alt="" width="56" height="56">
        <div class="person-main">
          <div class="person-title">
            <h3></h3>
            <span class="presence-badge"></span>
          </div>
          <p class="role"></p>
          <p class="location"></p>
          <a target="_blank" rel="noreferrer">View profile</a>
        </div>
      </article>
    </template>

    <template id="sectionTemplate">
      <section class="people-section">
        <div class="people-section-heading">
          <h3></h3>
          <p></p>
        </div>
        <div class="people-grid"></div>
      </section>
    </template>

    <script src="./app.js" type="module"></script>
  </body>
</html>
